[package]
name = "note-taker"
version = "0.8.1"
description = "Markdown notes in git-synced folders"
authors = ["Igor Kvasnicka"]
edition = "2021"
rust-version = "1.77.2"

# The version above is the single source of truth: `tauri.conf.json` deliberately
# omits `version`. Releases stay plain MAJOR.MINOR.PATCH; see docs/development.md.

[lib]
name = "note_taker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
directories = "6"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
toml = "1"
ulid = "3"
unicode-normalization = "0.1.25"
yaml-rust2 = "0.11"

[dev-dependencies]
serde_json = "1.0.151"
tempfile = "3.27.0"
tauri = { version = "2.11.5", features = ["test"] }
